name: Build Windows app

on:
  push:
    branches: [main]
    # a release is made when the version number changes (windows/subplayer_win/__init__.py), or by hand
    paths: ['windows/subplayer_win/__init__.py']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the zip as the public "windows" release (off: a test build — the zip is kept as a workflow artifact only)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Package (PyInstaller)
        run: |
          pyinstaller --noconfirm --windowed --name SubPlayer `
            --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime `
            --collect-submodules av --hidden-import PySide6.QtTextToSpeech --hidden-import PySide6.QtSvg --hidden-import socks --hidden-import urllib3.contrib.socks `
            --collect-all edge_tts --collect-data certifi `
            --add-data "subplayer_win/fonts;subplayer_win/fonts" --add-data "subplayer_win/data;subplayer_win/data" `
            run.py
      - name: Self-test the packaged app
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          # a test build (not published) must also download and use a voice from the Piper catalogue
          $env:SUBPLAYER_SELFTEST_PIPER = $(if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.publish }}" -ne "true") { "strict" } else { "1" })
          $env:SUBPLAYER_HOME = "$PWD\selftest-home"
          $p = Start-Process -FilePath dist\SubPlayer\SubPlayer.exe -ArgumentList "--selftest", "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed" }
      - name: Self-test portable mode
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $data = "$PWD\dist\SubPlayer\SubPlayer data"
          New-Item -ItemType Directory -Force $data | Out-Null
          $env:SUBPLAYER_SELFTEST_DATA = $data
          $p = Start-Process -FilePath dist\SubPlayer\SubPlayer.exe -ArgumentList "--selftest", "$PWD\selftest-portable.txt" -Wait -PassThru
          Get-Content selftest-portable.txt
          Remove-Item -Recurse -Force $data
          if ($p.ExitCode -ne 0) { throw "portable self-test failed" }
      - name: Zip
        run: |
          Copy-Item ..\README.md dist\SubPlayer\README.md
          Compress-Archive -Path dist\SubPlayer -DestinationPath SubPlayer-Windows.zip
          $h = (Get-FileHash SubPlayer-Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$h  SubPlayer-Windows.zip" | Out-File -Encoding ascii SubPlayer-Windows.sha256
          Get-Content SubPlayer-Windows.sha256
          (Get-Item SubPlayer-Windows.zip).Length
      - name: Keep the test build (not published)
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: SubPlayer-Windows-test
          path: |
            windows/SubPlayer-Windows.zip
            windows/SubPlayer-Windows.sha256
            windows/selftest.txt
            windows/selftest-portable.txt
          retention-days: 14
      - name: Publish release "windows"
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create windows --repo ${{ github.repository }} --title "SubPlayer for Windows" --notes "Unzip and run SubPlayer\SubPlayer.exe. Check: SHA-256 in SubPlayer-Windows.sha256." }
          gh release upload windows SubPlayer-Windows.zip SubPlayer-Windows.sha256 --clobber --repo ${{ github.repository }}
