name: Android check

# Compiles all four store versions and runs the unit tests for every push to the Android code. Publishes nothing.
on:
  push:
    branches: [main]
    paths: ['app/**', 'gradle/**', '*.gradle.kts', '.github/workflows/android-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3        # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
      - name: Compile and test
        run: |
          chmod +x gradlew
          ./gradlew testDirectDebugUnitTest testPlayDebugUnitTest compileDirectDebugKotlin compilePlayDebugKotlin compileBazaarDebugKotlin compileMyketDebugKotlin --stacktrace
