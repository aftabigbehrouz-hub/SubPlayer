name: Probe broadcaster support
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests av==19.0.2
      - run: python tools/ci/probe_english.py
      - run: python tools/ci/probe_media.py
