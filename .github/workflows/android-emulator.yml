name: Android emulator check

# Runs the app on an Android emulator, walks through the screens of version 2.7 and keeps a screenshot of each
# (artifact "emulator-screenshots"). Fails if the app crashes. Started by hand; publishes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3        # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      - name: Build a copy for the emulator (x86_64)
        run: |
          chmod +x gradlew
          ./gradlew assembleDirectDebug -Pabis=x86_64 --stacktrace

      - name: Allow hardware acceleration (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the emulator (Android 14)
        run: |
          SM=$ANDROID_HOME/cmdline-tools/latest/bin
          yes | $SM/sdkmanager --licenses > /dev/null || true
          $SM/sdkmanager "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64" > /dev/null
          echo no | $SM/avdmanager create avd -n tour -k "system-images;android-34;google_apis;x86_64" -d pixel_6
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          nohup $ANDROID_HOME/emulator/emulator -avd tour -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 4096 -camera-back none > emulator.log 2>&1 &
          $ANDROID_HOME/platform-tools/adb wait-for-device
          timeout 900 bash -c 'until [ "$($ANDROID_HOME/platform-tools/adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'
          A=$ANDROID_HOME/platform-tools/adb
          $A shell settings put global window_animation_scale 0
          $A shell settings put global transition_animation_scale 0
          $A shell settings put global animator_duration_scale 0
          $A shell input keyevent 82
          sleep 20

      - name: Walk through the app
        run: |
          which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          python3 tools/ci/emulator_tour.py app/build/outputs/apk/direct/debug/app-direct-debug.apk shots

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emulator-screenshots
          path: |
            shots
            emulator.log
          retention-days: 14
