name: Build APK

# Runs only for commits pushed to main by the owner (or started by hand).
# It never runs for pull requests from other people.
on:
  push:
    branches: [main]
    paths-ignore: ['tools/**', '.github/workflows/data.yml', '.github/workflows/data-en.yml', '.github/workflows/data-win.yml', 'README.md', 'PRIVACY.md', 'TERMS.md', 'play-store/**', 'iran-stores/**', 'windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Fingerprint of Behrouz's signing certificate. The release is refused if the
  # APK is signed with anything else.
  EXPECTED_CERT_SHA256: 7f8c8b676b35aa71b705f5b072c521bedd00ffb20f68ce4a95983882b4c9cc88

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Build tools pinned to exact, unchangeable versions (commit SHAs)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3        # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      # Compile check first (no key needed), so code errors show even without secrets
      - name: Compile (debug)
        run: |
          chmod +x gradlew
          ./gradlew testDirectDebugUnitTest testPlayDebugUnitTest compileDirectDebugKotlin compilePlayDebugKotlin compileBazaarDebugKotlin compileMyketDebugKotlin --stacktrace

      - name: Load signing key from encrypted secrets
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Signing secrets are missing - refusing to build an unsigned release."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK (direct) and app bundle (Google Play)
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew assembleDirectRelease bundlePlayRelease assembleBazaarRelease assembleMyketRelease \
            assembleBazaarLabelled assembleMyketLabelled assemblePlayLabelled --stacktrace
          mkdir -p test-copies
          cp app/build/outputs/apk/bazaar/labelled/app-bazaar-labelled.apk "test-copies/SubPlayer-TEST-Bazaar.apk"
          cp app/build/outputs/apk/myket/labelled/app-myket-labelled.apk "test-copies/SubPlayer-TEST-Myket.apk"
          cp app/build/outputs/apk/play/labelled/app-play-labelled.apk "test-copies/SubPlayer-TEST-Play.apk"
          cp app/build/outputs/apk/direct/release/app-direct-release.apk SubPlayer.apk
          cp app/build/outputs/apk/bazaar/release/app-bazaar-release.apk SubPlayer-CafeBazaar.apk
          cp app/build/outputs/apk/myket/release/app-myket-release.apk SubPlayer-Myket.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab SubPlayer-GooglePlay.aab
          rm -f "$SIGNING_KEYSTORE"

      - name: Check 16 KB page alignment (Google Play rule)
        run: |
          pip install -q pyelftools
          python3 tools/ci/check_16kb.py SubPlayer-GooglePlay.aab --allow libvosk.so SubPlayer.apk SubPlayer-CafeBazaar.apk SubPlayer-Myket.apk
          ZIPALIGN=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          "$ZIPALIGN" -c -P 16 4 SubPlayer.apk && echo "APK zip alignment OK (16 KB)"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for A in SubPlayer.apk SubPlayer-CafeBazaar.apk SubPlayer-Myket.apk test-copies/*.apk; do
            "$APKSIGNER" verify --print-certs "$A" | tee certs.txt
            CERT=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')
            if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$A signed with an unexpected certificate ($CERT)"
              exit 1
            fi
          done
          sha256sum SubPlayer.apk | tee SubPlayer.apk.sha256
          sha256sum SubPlayer-CafeBazaar.apk | tee SubPlayer-CafeBazaar.apk.sha256
          sha256sum SubPlayer-Myket.apk | tee SubPlayer-Myket.apk.sha256
          # the Play bundle must be signed with the same key (it becomes the Play "upload key")
          AAB_CERT=$(keytool -printcert -jarfile SubPlayer-GooglePlay.aab | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "AAB certificate SHA-256: $AAB_CERT"
          if [ "$AAB_CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::App bundle signed with an unexpected certificate ($AAB_CERT)"
            exit 1
          fi
          sha256sum SubPlayer-GooglePlay.aab | tee SubPlayer-GooglePlay.aab.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SubPlayer-apk
          path: |
            SubPlayer.apk
            SubPlayer-GooglePlay.aab
            SubPlayer-CafeBazaar.apk
            SubPlayer-Myket.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE_SHA=$(cut -d' ' -f1 SubPlayer.apk.sha256)
          gh release delete latest --yes --cleanup-tag || true
          AAB_SHA=$(cut -d' ' -f1 SubPlayer-GooglePlay.aab.sha256)
          gh release create latest SubPlayer.apk SubPlayer.apk.sha256 SubPlayer-GooglePlay.aab SubPlayer-GooglePlay.aab.sha256 \
            SubPlayer-CafeBazaar.apk SubPlayer-CafeBazaar.apk.sha256 SubPlayer-Myket.apk SubPlayer-Myket.apk.sha256 \
            --title "SubPlayer (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}.

          Signing certificate SHA-256: \`${EXPECTED_CERT_SHA256}\`
          APK file SHA-256: \`${FILE_SHA}\`
          Google Play bundle SHA-256: \`${AAB_SHA}\`

          SubPlayer.apk: open it on your phone. SubPlayer-GooglePlay.aab: upload in Google Play Console.
          SubPlayer-CafeBazaar.apk / SubPlayer-Myket.apk: upload in the Cafe Bazaar / Myket developer panels."

      - name: Publish test copies (owner's phone only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd test-copies && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release delete test-copies --yes --cleanup-tag || true
          gh release create test-copies test-copies/*.apk test-copies/SHA256SUMS.txt \
            --title "SubPlayer test copies (for the owner's phone)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Labelled versions with their own package names (.test), to install next to the normal app for checking. Not for the stores."

      - name: Store APK on apk branch
        run: |
          mkdir /tmp/out && cp SubPlayer.apk SubPlayer.apk.sha256 SubPlayer-GooglePlay.aab SubPlayer-GooglePlay.aab.sha256 \
            SubPlayer-CafeBazaar.apk SubPlayer-CafeBazaar.apk.sha256 SubPlayer-Myket.apk SubPlayer-Myket.apk.sha256 /tmp/out/
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
