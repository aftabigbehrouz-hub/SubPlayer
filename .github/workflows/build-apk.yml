name: Build APK

# Runs only for commits pushed to main by the owner (or started by hand).
# It never runs for pull requests from other people.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Fingerprint of Behrouz's signing certificate. The release is refused if the
  # APK is signed with anything else.
  EXPECTED_CERT_SHA256: 7f8c8b676b35aa71b705f5b072c521bedd00ffb20f68ce4a95983882b4c9cc88

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Build tools pinned to exact, unchangeable versions (commit SHAs)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3        # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      - name: Load signing key from encrypted secrets
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Signing secrets are missing - refusing to build an unsigned release."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk SubPlayer.apk
          rm -f "$SIGNING_KEYSTORE"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs SubPlayer.apk | tee certs.txt
          CERT=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')
          if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signed with an unexpected certificate ($CERT)"
            exit 1
          fi
          sha256sum SubPlayer.apk | tee SubPlayer.apk.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SubPlayer-apk
          path: SubPlayer.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE_SHA=$(cut -d' ' -f1 SubPlayer.apk.sha256)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SubPlayer.apk SubPlayer.apk.sha256 \
            --title "SubPlayer (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}.

          Signing certificate SHA-256: \`${EXPECTED_CERT_SHA256}\`
          APK file SHA-256: \`${FILE_SHA}\`

          Download SubPlayer.apk and open it on your phone."

      - name: Store APK on apk branch
        run: |
          mkdir /tmp/out && cp SubPlayer.apk SubPlayer.apk.sha256 /tmp/out/
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
