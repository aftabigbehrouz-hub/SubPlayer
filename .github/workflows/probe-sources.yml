name: Probe my sources
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Sources to try (space separated); empty = the built-in list"
        required: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python tools/ci/probe_sources.py
        env:
          PROBE_SOURCES: ${{ inputs.urls }}
      - name: Show the saved Telegram page size
        run: ls -la probe-out
