name: Build dictionary and mirror models

# Runs when the dictionary builder changes. Publishes everything the app downloads
# to the 'data-v1' release of this repository (reachable wherever GitHub is).
on:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/data.yml']

permissions:
  contents: write

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build German dictionary
        run: python3 tools/build_dict.py dict.db

      - name: Test dictionary with real words
        run: python3 tools/test_dict.py dict.db

      - name: Package dictionary
        run: |
          ls -la dict.db
          zip -9 -j dict-de-v1.zip dict.db
          ls -la dict-de-v1.zip

      - name: Mirror speech models
        run: |
          set -e
          curl -fL -o ggml-base-q5_1.bin  https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          curl -fL -o ggml-small-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          curl -fL -o ggml-silero-v5.1.2.bin https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin
          curl -fL -o vosk-model-small-de-0.15.zip https://alphacephei.com/vosk/models/vosk-model-small-de-0.15.zip
          curl -fL -o vosk-model-small-en-us-0.15.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip

      - name: Checksums
        run: |
          sha256sum dict-de-v1.zip ggml-*.bin vosk-*.zip | tee SHA256SUMS.txt
          stat -c '%n %s' dict-de-v1.zip ggml-*.bin vosk-*.zip

      - name: Publish data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-v1 >/dev/null 2>&1 || gh release create data-v1 --title "SubPlayer data v1" \
            --notes "Offline dictionary (Wiktionary, CC BY-SA 4.0) and speech models downloaded by the app. See SHA256SUMS.txt."
          gh release upload data-v1 dict-de-v1.zip ggml-base-q5_1.bin ggml-small-q5_1.bin ggml-silero-v5.1.2.bin \
            vosk-model-small-de-0.15.zip vosk-model-small-en-us-0.15.zip SHA256SUMS.txt --clobber
